<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="referrer" content="no-referrer" />
    <title>Thank you · Sandra &amp; Benjamin</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="after.css" />
    <script src="after.js" defer></script>
  </head>
  <body>
    <header class="page-header">
      <span class="monogram" aria-label="Sandra and Benjamin">S &amp; B</span>
      <div class="languages" role="group" aria-label="Language selector">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="no" aria-pressed="false">NO</button>
      </div>
    </header>
    <main class="thank-you">
      <figure class="portrait">
        <img src="Pictures/After/bryllupsbilde.jpg" width="1066" height="1599"
          alt="Sandra and Benjamin kissing in the mountains on their wedding day"
          fetchpriority="high" decoding="async" />
      </figure>
      <div class="message">
        <p class="eyebrow" data-i18n="date">Beitostølen · September 19, 2026</p>
        <h1 data-i18n="heading">Thank you!</h1>
        <p class="intro" data-i18n="thanks">Thank you for celebrating our wedding with us.</p>
        <p class="signature">Sandra &amp; Benjamin</p>
        <section class="sharing" aria-labelledby="sharing-title">
          <h2 id="sharing-title" data-i18n="photosTitle">Photos</h2>
          <p data-i18n="photosBody">Please share your photos and videos from the wedding with us.</p>
          <button class="button button-primary" type="button" id="share-photos" data-i18n="share" hidden>Share your photos ↗</button>
          <p class="album-note" id="album-note" data-i18n="albumNote" hidden>Google Photo · Opens in a new tab.</p>
          <noscript><p>Please enable JavaScript to open our shared photo album, or contact us for the link.<br />Slå på JavaScript for å åpne fotoalbumet, eller kontakt oss for lenken.</p></noscript>
        </section>
        <a class="button button-secondary" href="original.html" data-i18n="original">Original wedding website</a>
      </div>
    </main>
  </body>
</html>
